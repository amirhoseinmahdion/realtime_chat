services:
  - type: web
    name: online-chat-api
    runtime: node
    plan: free
    rootDir: back
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/online-chat/chat.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
